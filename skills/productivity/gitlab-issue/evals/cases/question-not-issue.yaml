id: question-not-issue
title: Question is not an issue request
description: |
  'what issues are open?' in a checkout of the project runs nothing that
  drafts or creates an issue.

context:
  repo_fixture: scripts/fixtures/repo-full
  git:
    init: true
    remotes:
      - name: origin
        url: https://gitlab.example.com/team/billing-export.git

input:
  prompt: |
    what issues are open?

expect:
  must_not_contain:
    - "## Issue draft"
    - "Issue created:"
    - "Context used:"

judge:
  type: rule_based
  failure:
    - output_contains:
        any:
          - "## Issue draft"
          - "Issue created:"
          - "Context used:"
