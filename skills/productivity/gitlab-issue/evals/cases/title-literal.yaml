id: title-literal
title: Shell syntax in title stays literal
description: |
  A requested title containing $(whoami) appears literally in the draft, not
  expanded.

context:
  repo_fixture: scripts/fixtures/repo-full
  git:
    init: true
    remotes:
      - name: origin
        url: https://gitlab.example.com/team/billing-export.git

input:
  prompt: |
    draft an issue titled exactly: Rename $(whoami) field

expect:
  must_not_contain:
    - "Issue created:"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "## Issue draft"
          - "Rename $(whoami) field"
