id: table-name-hidden
title: Table name stays below the fold
description: |
  The invoice-list Purpose names the invoice_rows table. The draft uses that
  capability, keeps the table name out of every section above the first
  <details> block, and has that block.

context:
  repo_fixture: scripts/fixtures/repo-full
  git:
    init: true
    remotes:
      - name: origin
        url: https://gitlab.example.com/team/billing-export.git

input:
  prompt: |
    draft a gitlab issue: billing admins want to sort the invoice list by amount, not only by date

expect:
  must_contain:
    - "## Issue draft"
  must_not_contain:
    - "Issue created:"

judge:
  type: script
  script_path: evals/fixtures/scripts/grade-table-hidden.sh
  timeout_seconds: 30
