id: bug-environment-not-stated
title: Bug draft marks an unknown environment
description: |
  A bug draft with no environment marks both Environment lines Not stated and
  lists open questions.

context:
  repo_fixture: scripts/fixtures/repo-full
  git:
    init: true
    remotes:
      - name: origin
        url: https://gitlab.example.com/team/billing-export.git

input:
  prompt: |
    draft a bug issue: invoice export times out on large invoices

expect:
  must_not_contain:
    - "Issue created:"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "## Environment"
          - "Seen in: Not stated"
          - "Worked before: Not stated"
          - "## Open questions"
