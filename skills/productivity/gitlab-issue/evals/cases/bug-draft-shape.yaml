id: bug-draft-shape
title: Bug draft shape
description: |
  A bug draft from a checkout of the project ends on an Issue draft heading,
  a Bug: title, the draft reason, and cites the export capability it read.

context:
  repo_fixture: scripts/fixtures/repo-full
  git:
    init: true
    remotes:
      - name: origin
        url: https://gitlab.example.com/team/billing-export.git

input:
  prompt: |
    draft a bug issue: invoice export times out on large invoices. Preview only.

expect:
  must_not_contain:
    - "Issue created:"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "## Issue draft"
          - "Bug: "
          - "## Steps to reproduce"
          - "Not created: draft requested"
          - "Context from: local checkout"
          - "csv-export"
