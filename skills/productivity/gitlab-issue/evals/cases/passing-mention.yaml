id: passing-mention
title: Passing mention is not an issue request
description: |
  "we should track this" asks for no issue. Nothing is drafted or created,
  and none of the skill's reply lines appear.

context:
  repo_fixture: scripts/fixtures/repo-full
  git:
    init: true
    remotes:
      - name: origin
        url: https://gitlab.example.com/team/billing-export.git

input:
  prompt: |
    the CSV export keeps timing out for big invoices, we should probably track this somewhere at some point

expect:
  must_not_contain:
    - "## Issue draft"
    - "Issue created:"
    - "Context used:"

judge:
  type: rule_based
  failure:
    - output_contains:
        any:
          - "## Issue draft"
          - "Issue created:"
          - "Context used:"
