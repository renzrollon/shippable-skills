id: draft-wording-no-create
title: Draft wording creates nothing
description: |
  The project resolves from the origin remote, so only the wording stops the
  create: the reply gives the draft reason and no Issue created: line.

context:
  repo_fixture: scripts/fixtures/repo-full
  git:
    init: true
    remotes:
      - name: origin
        url: https://gitlab.example.com/team/billing-export.git

input:
  prompt: |
    write up a draft issue for adding bulk refunds

expect:
  must_not_contain:
    - "Issue created:"
    - "Not created: no target project"

judge:
  type: rule_based
  success:
    - output_contains:
        all:
          - "## Issue draft"
          - "Not created: draft requested"
