id: no-context
title: No context found
description: |
  An empty repo with no openspec/, no docs/ and no remote gives a draft with no
  citations: Context from none, Context used none, Related not checked, and no
  technical notes block.

context:
  git:
    init: true

input:
  prompt: |
    draft a gitlab issue: the dashboard loads slowly

expect:
  must_not_contain:
    - "Issue created:"
    - "<summary>Technical notes"

judge:
  type: rule_based
  failure:
    - output_contains:
        any:
          - "<summary>Technical notes"
  success:
    - output_contains:
        all:
          - "## Issue draft"
          - "Not checked (no project context)"
          - "Context from: none"
          - "Context used: none"
