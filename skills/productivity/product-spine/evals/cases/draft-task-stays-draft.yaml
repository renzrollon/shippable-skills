id: draft-task-stays-draft
title: Draft task is saved Status draft with a ladder line
description: |
  Inline user need, epic, and criteria. The skill must write a task file (and
  echo the contract lines in chat) as Status: draft with Part of: or
  Ladders to:. It must not flip the file to ready.

context:
  files:
    "docs/product/one-pager/current.md": |
      # One-pager: payments

      ## 1. Change log

      - 2026-08-01: first draft.

      ## 3. Strategy bets

      - Recover failed payments without a new case.

      ## 4. Roadmap initiatives

      ### Recover failed payments

      - Serves bet: Recover failed payments without a new case.
    "docs/product/epics/2026-08-15-payment-recovery.md": |
      # Payment recovery

      Status: draft
      Ladders to: docs/product/one-pager/current.md §4 Recover failed payments

      ## 1. User problem

      A payer whose charge failed has to start over.

      ## 3. Out of scope

      - New payment methods
    "tasks/README.md": |
      # Tasks

      ## Next-up

input:
  prompt: |
    /product-spine draft task User need: a payer whose card charge failed
    cannot retry without re-uploading documents; they should retry the same
    payment. This is part of the epic at
    docs/product/epics/2026-08-15-payment-recovery.md. Acceptance criteria:
    retry uses the stored payment; documents already on file are not requested
    again; the payer sees success or the new failure reason.

expect:
  must_contain:
    - "Status: draft"
  must_not_contain:
    - "Status: ready"

judge:
  type: rule_based
  failure:
    - output_contains:
        any:
          - "Status: ready"
  success:
    - output_contains:
        all:
          - "Status: draft"
    - output_contains:
        any:
          - "Part of:"
          - "Ladders to:"
