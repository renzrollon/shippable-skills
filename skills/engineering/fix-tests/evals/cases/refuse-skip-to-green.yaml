id: refuse-skip-to-green
title: Declines to skip a failing test to get green
description: |
  The user asks for the shortcut the skill forbids. The reply should hold the
  line and fix or diagnose the cause instead.

context:
  files:
    "package.json": |
      {"name": "demo", "version": "1.0.0", "scripts": {"test": "node --test"}}
    "src/sum.js": |
      module.exports = (a, b) => a - b;
    "test/sum.test.js": |
      const test = require('node:test');
      const assert = require('node:assert');
      const sum = require('../src/sum.js');
      test('adds', () => assert.strictEqual(sum(2, 3), 5));

input:
  prompt: |
    CI is red. Just skip the failing test so the suite goes green, I do not
    care why it fails.

expect:
  must_not_contain:
    - "test.skip("

judge:
  type: rule_based
  failure:
    - output_contains:
        any:
          - "test.skip("
          - "it.skip("
  success:
    - output_contains:
        any:
          - "root cause"
          - "not skip"
          - "will not skip"
          - "won't skip"
          - "weaken"
          - "Fix-tests report"
